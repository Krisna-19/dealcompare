# Render blueprint for the DealCompare API.
#
# Declarative replacement for the dashboard-configured Python buildpack: the
# service runs the Docker image so Playwright + Chromium are provisioned
# deterministically alongside the app.
#
# Secrets (e.g. AMAZON_AFFILIATE_TAG overrides) should be set in the Render
# dashboard per service; this file only wires non-secret defaults.
services:
  - type: web
    name: dealcompare-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "/ms-playwright"
      - key: HEADLESS_BROWSER
        value: "true"
      - key: LOG_LEVEL
        value: "INFO"
      - key: METRICS_ENABLED
        value: "true"
      # Intended production data-source topology (see app/core/config.py):
      # official APIs where available, browser-free Myntra HTTP, Ajio deferred.
      # Credentials (Amazon Creators client id/secret + partner tag, Flipkart
      # affiliate id/token) are set ONLY in the Render dashboard.  When a
      # marketplace is on "api" but its credentials are missing/expired the
      # adapter fails safe with honest empty and NEVER launches the browser;
      # "disabled" means the source is not invoked at all.
      - key: AMAZON_DATA_SOURCE
        value: "api"
      - key: FLIPKART_DATA_SOURCE
        value: "api"
      - key: MYNTRA_DATA_SOURCE
        value: "http"
      - key: AJIO_DATA_SOURCE
        value: "disabled"
      # The JSON catalog needs a persistent disk (it is written to ./data).
      # Render's Free plan has NO persistent disk: the file would be lost on
      # every redeploy, so the catalog is disabled there.  The implementation
      # stays available -- set CATALOG_ENABLED=true (or drop this var) once the
      # service runs with a mounted persistent volume + DEALCOMPARE_DATA_DIR.
      - key: CATALOG_ENABLED
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "false"